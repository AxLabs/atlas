# Consumer-owned Lighthouse CI. GitHub-hosted Ubuntu. No BlitzCraft runners.
# Local equivalent: pnpm build && pnpm perf:lhci
name: Performance - Lighthouse CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "lighthouserc.json"

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @atlas/web... build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Run Lighthouse CI
        run: pnpm perf:lhci
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # Optional. Local `pnpm perf:lhci` does not need this token.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
