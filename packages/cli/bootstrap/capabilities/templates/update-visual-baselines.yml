# Manually triggered only. Produce candidate visual baselines in the canonical
# Playwright Docker image, download and review the artifact, then commit the
# reviewed PNGs. This workflow does not auto-commit or auto-approve changes.
#
# Do not capture baselines on a developer laptop or the host runner.
name: Update Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-baselines:
    name: Generate candidate visual baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @atlas/ui build-storybook

      - name: Recapture baselines in Playwright Docker
        run: pnpm --filter @atlas/ui exec node scripts/run-visual-in-playwright-docker.mjs --update

      - name: Upload candidate baselines (review before committing)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-visual-baselines-${{ github.run_id }}
          path: packages/ui/visual-tests/__snapshots__/
          retention-days: 30
