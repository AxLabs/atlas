name: Setup CI Node environment
description: Writable HOME, persistent pnpm store, Turbo cache, Node 22, and pnpm
runs:
  using: composite
  steps:
    - name: Configure writable HOME
      shell: bash
      run: |
        home="${RUNNER_TEMP}/home-${{ github.job }}-${{ github.run_attempt }}"
        mkdir -p "$home"
        echo "HOME=${home}" >> "$GITHUB_ENV"
        rm -rf "${RUNNER_TEMP}/setup-pnpm" 2>/dev/null || \
          sudo rm -rf "${RUNNER_TEMP}/setup-pnpm" 2>/dev/null || true

    - name: Configure persistent caches
      shell: bash
      run: |
        cache_root="${CI_CACHE_ROOT:-/var/cache/ci}"
        repo_slug="${GITHUB_REPOSITORY//\//-}"
        pnpm_store="${cache_root}/pnpm-store/${repo_slug}"
        turbo_cache="${cache_root}/turbo/${repo_slug}"
        mkdir -p "$pnpm_store" "$turbo_cache" 2>/dev/null || \
          sudo mkdir -p "$pnpm_store" "$turbo_cache"
        sudo chown -R "$(id -u):$(id -g)" "$pnpm_store" "$turbo_cache" 2>/dev/null || true
        echo "PNPM_STORE_DIR=${pnpm_store}" >> "$GITHUB_ENV"
        echo "TURBO_CACHE_DIR=${turbo_cache}" >> "$GITHUB_ENV"

    - name: Resolve package manifest for pnpm
      shell: bash
      run: |
        if [[ -n "${CI_CHECKOUT_DIR:-}" && -f "${GITHUB_WORKSPACE}/${CI_CHECKOUT_DIR}/package.json" ]]; then
          manifest="${CI_CHECKOUT_DIR}/package.json"
        elif [[ -n "${CI_FIXED_WORKSPACE:-}" && -f "${GITHUB_WORKSPACE}/${CI_FIXED_WORKSPACE}/package.json" ]]; then
          manifest="${CI_FIXED_WORKSPACE}/package.json"
        else
          manifest="package.json"
        fi
        echo "PNPM_PACKAGE_JSON=${manifest}" >> "$GITHUB_ENV"
        echo "Using package manifest: ${manifest}"

    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        package_json_file: ${{ env.PNPM_PACKAGE_JSON }}

    # Self-hosted runners use the persistent PNPM_STORE_DIR above. Omit setup-node
    # cache so post steps do not try to save GitHub Actions pnpm cache paths.
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 22

    - name: Configure pnpm persistent store
      shell: bash
      run: |
        pnpm config set --global storeDir "$PNPM_STORE_DIR"
        actual_store="$(pnpm config get storeDir)"
        echo "pnpm storeDir: ${actual_store}"
        if [[ "${actual_store}" != "${PNPM_STORE_DIR}" ]]; then
          echo "Expected pnpm store ${PNPM_STORE_DIR}, got ${actual_store}" >&2
          exit 1
        fi
