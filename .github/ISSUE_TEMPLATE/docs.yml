name: Documentation issue
description: Report unclear, incorrect, or missing Atlas documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for docs in this repository (`README.md`, `docs/public/`, `docs/how-we-build/`,
        `CONTRIBUTING.md`, and related files).

        **Do not report security vulnerabilities in a public GitHub issue.** Use
        [private vulnerability reporting](https://github.com/blitzcraftlabs/atlas/security/advisories/new).
  - type: input
    id: page
    attributes:
      label: Affected page or file
      description: Path or URL if known.
      placeholder: docs/public/quickstart.md
  - type: textarea
    id: issue
    attributes:
      label: What is unclear, incorrect, or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional. A proposed wording or outline is enough.
