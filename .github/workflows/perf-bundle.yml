name: Performance - Bundle Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ATLAS_CI_RUNNER_PROFILE: ${{ vars.ATLAS_CI_RUNNER_PROFILE || 'github-hosted' }}
  ATLAS_CI_RUNNER_GROUP: ${{ vars.ATLAS_CI_RUNNER_GROUP || 'Blitzcraft OSS Trusted' }}
  ATLAS_CI_USE_SELF_HOSTED:
    ${{ vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted' && (github.event_name != 'pull_request' ||
    github.event.pull_request.head.repo.full_name == github.repository) }}
  BUDGET_TOTAL_STATIC_JS_KB: 3000
  BUDGET_LARGEST_CHUNK_KB: 950
  MAX_BUNDLE_GROWTH_KB: 100
  MAX_BUNDLE_GROWTH_PERCENT: 15

jobs:
  analyze-hosted:
    name: Bundle Analysis
    if: env.ATLAS_CI_USE_SELF_HOSTED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Run bundle analysis suite
        uses: ./.github/actions/run-bundle-analysis-suite
        with:
          runner-profile: github-hosted

  analyze-trusted:
    if: env.ATLAS_CI_USE_SELF_HOSTED == 'true'
    timeout-minutes: 15
    uses: blitzcraftlabs/atlas/.github/workflows/trusted-self-hosted.yml@refs/heads/main
    with:
      suite: bundle
      runner_group: ${{ vars.ATLAS_CI_RUNNER_GROUP || 'Blitzcraft OSS Trusted' }}
      check_name: Bundle Analysis
      checkout_prefix: bundle-ws-
    secrets: inherit

  analyze:
    name: Bundle Analysis
    if: env.ATLAS_CI_USE_SELF_HOSTED == 'true' && always()
    needs:
      - analyze-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify trusted bundle analysis completed
        shell: bash
        run: |
          result="${{ needs.analyze-trusted.result }}"
          if [[ "$result" == "success" ]]; then
            echo "Trusted self-hosted bundle analysis passed."
            exit 0
          fi
          echo "Trusted self-hosted bundle analysis did not succeed (result=${result})." >&2
          exit 1
