name: Performance - Bundle Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bundle budgets in KB (uncompressed .next/static/*.js)
  # Baseline from main: ~2.4 MB total static JS; largest framework chunk ~790 KB
  BUDGET_TOTAL_STATIC_JS_KB: 3000
  BUDGET_LARGEST_CHUNK_KB: 950
  MAX_BUNDLE_GROWTH_KB: 100
  MAX_BUNDLE_GROWTH_PERCENT: 15
  ATLAS_CI_RUNNER_PROFILE: ${{ vars.ATLAS_CI_RUNNER_PROFILE || 'github-hosted' }}
  ATLAS_CI_USE_SELF_HOSTED:
    ${{ vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted' && (github.event_name != 'pull_request' ||
    github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  detect:
    name: Detect bundle changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bundle: ${{ steps.detect.outputs.bundle }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Detect bundle-impacting changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          BOOTSTRAP_PATTERN='^(scripts/bundle-paths\.mjs|scripts/__tests__/bundle-paths\.test\.mjs|scripts/lib/ci-path-classification\.mjs|\.github/workflows/perf-bundle\.yml|\.github/actions/run-bundle-analysis-suite/action\.yml)'

          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$BOOTSTRAP_PATTERN"; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUNDLE="$(node scripts/bundle-paths.mjs --git-diff "$BASE" "$HEAD")"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

  bundle-hosted:
    name: Bundle Analysis (hosted)
    needs: detect
    if: needs.detect.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Atlas CI
        uses: ./.github/actions/setup-atlas-ci
        with:
          runner-profile: github-hosted

      - name: Run bundle analysis suite
        uses: ./.github/actions/run-bundle-analysis-suite
        with:
          runner-profile: github-hosted

  bundle:
    name: Bundle Analysis
    needs: [detect, bundle-hosted]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate Bundle Analysis results
        run: |
          detect="${{ needs.detect.result }}"
          bundle="${{ needs.detect.outputs.bundle }}"
          hosted="${{ needs.bundle-hosted.result }}"
          echo "detect=${detect} bundle=${bundle} hosted=${hosted}"
          if [ "$detect" != success ]; then
            echo "Bundle Analysis path detection failed."
            exit 1
          fi
          if [ "$bundle" != "true" ]; then
            echo "No bundle-impacting changes; Bundle Analysis skipped on GitHub-hosted Ubuntu."
            exit 0
          fi
          if [ "$hosted" = success ]; then
            exit 0
          fi
          echo "Required Bundle Analysis hosted path did not succeed (fail closed)."
          exit 1
