name: Performance - Bundle Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/ui/**"

jobs:
  analyze:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run bundle analyzer
        run: pnpm perf:analyze

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: |
            apps/web/.next/analyze
          retention-days: 30

      - name: Generate bundle summary
        if: always()
        run: |
          echo "## Bundle Analysis Complete 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Bundle analysis reports have been generated and uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "Download the artifacts to view detailed analysis." >> $GITHUB_STEP_SUMMARY
