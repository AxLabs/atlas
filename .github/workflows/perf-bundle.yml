name: Performance - Bundle Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bundle budgets in KB (uncompressed .next/static/*.js)
  # Baseline from main: ~2.4 MB total static JS; largest framework chunk ~790 KB
  BUDGET_TOTAL_STATIC_JS_KB: 3000
  BUDGET_LARGEST_CHUNK_KB: 950
  MAX_BUNDLE_GROWTH_KB: 100
  MAX_BUNDLE_GROWTH_PERCENT: 15
  ATLAS_CI_RUNNER_PROFILE: ${{ vars.ATLAS_CI_RUNNER_PROFILE || 'github-hosted' }}
  ATLAS_CI_USE_SELF_HOSTED:
    ${{ vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted' && (github.event_name != 'pull_request' ||
    github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  bundle-hosted:
    name: Bundle Analysis (hosted)
    if: |
      vars.ATLAS_CI_RUNNER_PROFILE != 'self-hosted' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Atlas CI
        uses: ./.github/actions/setup-atlas-ci
        with:
          runner-profile: github-hosted

      - name: Run bundle analysis suite
        uses: ./.github/actions/run-bundle-analysis-suite
        with:
          runner-profile: github-hosted

  bundle-trusted:
    name: Bundle Analysis (trusted)
    if: |
      vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: blitzcraftlabs/atlas/.github/workflows/trusted-self-hosted.yml@main
    with:
      suite: bundle

  bundle:
    name: Bundle Analysis
    needs: [bundle-hosted, bundle-trusted]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate Bundle Analysis results
        run: |
          hosted="${{ needs.bundle-hosted.result }}"
          trusted="${{ needs.bundle-trusted.result }}"
          echo "hosted=${hosted} trusted=${trusted}"
          if { [ "$hosted" = success ] && [ "$trusted" = skipped ]; } || \
             { [ "$hosted" = skipped ] && [ "$trusted" = success ]; }; then
            exit 0
          fi
          echo "Required Bundle Analysis path did not succeed (fail closed; no hosted fallback for trusted failures)."
          exit 1
