name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Release Rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate governance
        run: pnpm governance:check

      - name: Run isolated release rehearsal
        run: pnpm release:rehearse

      - name: Rehearsal summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "✓ Release rehearsal completed (dry run — no tag or GitHub Release created)"
          echo "  Current Atlas line: v${VERSION}"
          echo "  GitHub Release publication remains deferred to issue #24"

  version-pr:
    name: Atlas Version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update Version PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore(release): atlas version"
          commit: "chore(release): atlas version"
          version: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Version PR outcome
        if: always()
        run: |
          if [ "${{ steps.changesets.outputs.hasChangesets }}" = "true" ]; then
            echo "ℹ️ Pending changesets — Version PR opened or updated."
          else
            echo "ℹ️ No pending changesets — no Version PR action required."
          fi
          echo "ℹ️ GitHub Release publication is disabled until issue #24."
