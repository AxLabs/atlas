name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not treat this as the mutation-safety lock. The publisher reloads GitHub
  # state after required checks and re-evaluates the original target SHA.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rehearsal:
    name: Release Rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate governance
        run: pnpm governance:check

      - name: Run isolated release rehearsal
        run: pnpm release:rehearse

      - name: Rehearsal summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "✓ Release rehearsal completed (dry run — no tag or GitHub Release created)"
          echo "  Current Atlas line: v${VERSION}"

  sbom:
    name: SBOM snapshot
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Do not enable cache: pnpm here. This job never runs `pnpm install`, so the
      # setup-node post-step would fail with:
      # "Path(s) specified in the action for caching do(es) not exist".
      # setup-node@v5 auto-enables package-manager-cache when it detects pnpm;
      # disable it so Post Setup Node.js does not try to save a missing store.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate SPDX SBOM
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm sbom:generate --output "artifacts/atlas-sbom-${GITHUB_SHA}.spdx.json"

      - name: Validate SBOM JSON
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = `artifacts/atlas-sbom-${process.env.GITHUB_SHA}.spdx.json`;
            const doc = JSON.parse(fs.readFileSync(file, "utf8"));
            if (!doc.spdxVersion || !Array.isArray(doc.packages) || doc.packages.length === 0) {
              throw new Error("SBOM is missing SPDX metadata or package records");
            }
            console.log(`✓ SBOM valid (${doc.packages.length} packages)`);
          '

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-sbom-${{ github.sha }}
          path: artifacts/atlas-sbom-${{ github.sha }}.spdx.json
          retention-days: 90

  version-pr:
    name: Atlas Version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update Version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "chore(release): atlas version"
          commit: "chore(release): atlas version"
          version: pnpm changeset:version
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Version PR outcome
        if: always()
        run: |
          if [ "${{ steps.changesets.outputs.hasChangesets }}" = "true" ]; then
            echo "ℹ️ Pending changesets — Version PR opened or updated."
          else
            echo "ℹ️ No pending changesets — no Version PR action required."
          fi

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && needs.version-pr.outputs.has-changesets != 'true'
    needs:
      - sbom
      - version-pr
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish canonical tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-atlas-release.mjs --target-sha "${GITHUB_SHA}"
