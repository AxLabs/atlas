name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ATLAS_CI_RUNNER_PROFILE: ${{ vars.ATLAS_CI_RUNNER_PROFILE || 'github-hosted' }}

jobs:
  changes:
    name: Detect Changes
    runs-on:
      ${{ vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted' && fromJSON('["self-hosted", "ci"]') ||
      'ubuntu-latest' }}
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect application changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE" "$HEAD" | grep -qE \
            '^(apps/|packages/|openapi/|scripts/|\.github/workflows/ci\.yml|turbo\.json|package\.json|pnpm-lock\.yaml|tsconfig.*\.json|eslint\.config)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup job artifacts
        if: always() && vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted'
        uses: ./.github/actions/cleanup-self-hosted-job

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks in Docker (fail on secrets)
        run: |
          docker run --rm --network=none \
            -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --no-git --source=/repo \
            --redact --verbose --exit-code 1

  quality:
    name: Quality
    needs: changes
    runs-on:
      ${{ vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted' && fromJSON('["self-hosted", "ci"]') ||
      'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for forbidden lockfiles
        run: |
          FORBIDDEN_LOCKFILES=""

          if [ -f "package-lock.json" ]; then
            FORBIDDEN_LOCKFILES="$FORBIDDEN_LOCKFILES package-lock.json"
          fi

          if [ -f "yarn.lock" ]; then
            FORBIDDEN_LOCKFILES="$FORBIDDEN_LOCKFILES yarn.lock"
          fi

          if [ -f "bun.lockb" ]; then
            FORBIDDEN_LOCKFILES="$FORBIDDEN_LOCKFILES bun.lockb"
          fi

          if [ -n "$FORBIDDEN_LOCKFILES" ]; then
            echo "❌ Error: Forbidden lockfiles detected:$FORBIDDEN_LOCKFILES"
            echo ""
            echo "Atlas enforces pnpm as the only package manager."
            echo "Please remove these files and use 'pnpm install' instead."
            exit 1
          fi

          echo "✅ No forbidden lockfiles found"

      - name: Check lockfile exists
        run: |
          if [ ! -f "pnpm-lock.yaml" ]; then
            echo "❌ Error: pnpm-lock.yaml is required but not found"
            exit 1
          fi
          echo "✅ Lockfile exists"

      - name: Setup Atlas CI
        if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
        uses: ./.github/actions/setup-atlas-ci
        with:
          runner-profile: ${{ env.ATLAS_CI_RUNNER_PROFILE }}

      - name: Install dependencies
        if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is up-to-date
        if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
        run: |
          if ! git diff --exit-code pnpm-lock.yaml; then
            echo "❌ Error: pnpm-lock.yaml is out of date"
            echo "Please run 'pnpm install' and commit the updated lockfile"
            exit 1
          fi
          echo "✅ Lockfile is up-to-date"

      - name: Validate environment variables
        if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
        run: pnpm validate:env
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://user:password@localhost:5432/atlas_ci
          NEXT_PUBLIC_API_URL: https://api.example.com

      - name: Run Prettier check
        if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
        run: pnpm format

      - name: Run ESLint
        if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
        run: pnpm lint

      - name: Run TypeScript check
        if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
        run: pnpm typecheck

      - name: Run unit tests
        if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
        run: pnpm test
        env:
          CI: true

      - name: Check UI coverage thresholds
        if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
        run: pnpm --filter @atlas/ui test:coverage
        env:
          CI: true

      - name: Upload coverage
        if: success() && (needs.changes.outputs.app == 'true' || github.event_name == 'push')
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/ui/coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Skip application checks (docs-only change)
        if: needs.changes.outputs.app != 'true' && github.event_name == 'pull_request'
        run: echo 'Docs-only PR. Skipped install, lint, typecheck, and tests.'

      - name: Cleanup job artifacts
        if: always() && vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted'
        uses: ./.github/actions/cleanup-self-hosted-job

  build-and-e2e:
    name: Build and E2E
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'push'
    runs-on:
      ${{ vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted' && fromJSON('["self-hosted", "ci"]') ||
      'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Atlas CI
        uses: ./.github/actions/setup-atlas-ci
        with:
          runner-profile: ${{ env.ATLAS_CI_RUNNER_PROFILE }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          CI: true
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Install Playwright browsers
        run: |
          if [ "${ATLAS_CI_RUNNER_PROFILE}" = "self-hosted" ]; then
            # Self-hosted runners lack passwordless sudo for apt; provision system deps on the
            # host once with `playwright install-deps chromium` (see docs/how-we-build/ci.md).
            pnpm --filter @atlas/web exec playwright install chromium
          else
            pnpm --filter @atlas/web exec playwright install --with-deps chromium
          fi

      - name: Run E2E tests
        run: pnpm --filter @atlas/web test:e2e
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          SKIP_ENV_VALIDATION: false

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Cleanup job artifacts
        if: always() && vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted'
        uses: ./.github/actions/cleanup-self-hosted-job
