name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ATLAS_CI_RUNNER_PROFILE: ${{ vars.ATLAS_CI_RUNNER_PROFILE || 'github-hosted' }}
  ATLAS_CI_RUNNER_GROUP: ${{ vars.ATLAS_CI_RUNNER_GROUP || 'Blitzcraft OSS Trusted' }}
  ATLAS_CI_USE_SELF_HOSTED:
    ${{ vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted' && (github.event_name != 'pull_request' ||
    github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate licensing, versioning, and release governance
        run: node scripts/validate-governance.mjs

      - name: Validate dependency ownership
        run: pnpm dependencies:check

      - name: Validate dependency license policy
        run: pnpm licenses:check

      - name: Validate provenance (current tree)
        run: pnpm provenance:check

  ci-hosted:
    name: CI
    if: env.ATLAS_CI_USE_SELF_HOSTED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Atlas CI (GitHub-hosted)
        uses: ./.github/actions/setup-atlas-ci
        with:
          runner-profile: github-hosted

      - name: Run CI suite
        uses: ./.github/actions/run-ci-suite
        with:
          runner-profile: github-hosted
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ci-trusted:
    if: env.ATLAS_CI_USE_SELF_HOSTED == 'true'
    timeout-minutes: 90
    uses: blitzcraftlabs/atlas/.github/workflows/trusted-self-hosted.yml@refs/heads/main
    with:
      suite: ci
      runner_group: ${{ vars.ATLAS_CI_RUNNER_GROUP || 'Blitzcraft OSS Trusted' }}
      check_name: CI
      checkout_prefix: ci-ws-
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ci:
    name: CI
    if: env.ATLAS_CI_USE_SELF_HOSTED == 'true' && always()
    needs:
      - ci-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify trusted CI suite completed
        shell: bash
        run: |
          result="${{ needs.ci-trusted.result }}"
          if [[ "$result" == "success" ]]; then
            echo "Trusted self-hosted CI suite passed."
            exit 0
          fi
          echo "Trusted self-hosted CI suite did not succeed (result=${result})." >&2
          exit 1

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks in Docker (fail on secrets)
        run: |
          docker run --rm --network=none \
            -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose --exit-code 1 /repo
          # gitleaks v8.30.1 — git-aware history scan of the fetched checkout
