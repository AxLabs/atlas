name: UI Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-quality:
    name: UI Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Detect UI changes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          UI="$(node scripts/ui-quality-paths.mjs --git-diff "$BASE" "$HEAD")"
          echo "ui=$UI" >> "$GITHUB_OUTPUT"

      - name: Skip UI quality (no UI changes)
        if: steps.detect.outputs.ui != 'true'
        run: echo "No UI-impacting changes detected. Skipping Storybook quality gates."

      - name: Setup pnpm
        if: steps.detect.outputs.ui == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.19.0

      - name: Setup Node.js
        if: steps.detect.outputs.ui == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.ui == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        if: steps.detect.outputs.ui == 'true'
        run: pnpm --filter @atlas/ui build-storybook

      - name: Install Playwright browsers
        if: steps.detect.outputs.ui == 'true'
        run: pnpm --filter @atlas/ui exec playwright install --with-deps chromium webkit

      - name: Validate critical Storybook policy
        if: steps.detect.outputs.ui == 'true'
        run: node scripts/storybook-critical-policy.mjs

      - name: Run Storybook interaction and accessibility tests
        if: steps.detect.outputs.ui == 'true'
        run: pnpm --filter @atlas/ui test:storybook

      - name: Run cross-browser keyboard and focus checks
        if: steps.detect.outputs.ui == 'true'
        run: pnpm --filter @atlas/ui test:storybook:cross-browser

      - name: Run visual regression tests
        if: steps.detect.outputs.ui == 'true'
        run: pnpm --filter @atlas/ui test:visual

      - name: Upload visual diff artifacts
        if: failure() && steps.detect.outputs.ui == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-quality-visual-diffs
          path: |
            packages/ui/test-results/
            packages/ui/playwright-report-visual/
            packages/ui/playwright-report-storybook/
          retention-days: 14
