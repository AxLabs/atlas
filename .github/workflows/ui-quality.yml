name: UI Quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ATLAS_CI_RUNNER_PROFILE: ${{ vars.ATLAS_CI_RUNNER_PROFILE || 'github-hosted' }}
  ATLAS_CI_RUNNER_GROUP: ${{ vars.ATLAS_CI_RUNNER_GROUP || 'Blitzcraft OSS Trusted' }}
  ATLAS_CI_USE_SELF_HOSTED:
    ${{ vars.ATLAS_CI_RUNNER_PROFILE == 'self-hosted' && (github.event_name != 'pull_request' ||
    github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  ui-quality-hosted:
    name: UI Quality
    if: env.ATLAS_CI_USE_SELF_HOSTED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Run UI quality suite
        uses: ./.github/actions/run-ui-quality-suite
        with:
          runner-profile: github-hosted

  ui-quality-trusted:
    if: env.ATLAS_CI_USE_SELF_HOSTED == 'true'
    timeout-minutes: 45
    uses: blitzcraftlabs/atlas/.github/workflows/trusted-self-hosted.yml@refs/heads/main
    with:
      suite: ui-quality
      runner_group: ${{ vars.ATLAS_CI_RUNNER_GROUP || 'Blitzcraft OSS Trusted' }}
      check_name: UI Quality
      checkout_prefix: ui-ws-

  ui-quality:
    name: UI Quality
    if: env.ATLAS_CI_USE_SELF_HOSTED == 'true' && always()
    needs:
      - ui-quality-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify trusted UI quality suite completed
        shell: bash
        run: |
          result="${{ needs.ui-quality-trusted.result }}"
          if [[ "$result" == "success" ]]; then
            echo "Trusted self-hosted UI quality suite passed."
            exit 0
          fi
          echo "Trusted self-hosted UI quality suite did not succeed (result=${result})." >&2
          exit 1
