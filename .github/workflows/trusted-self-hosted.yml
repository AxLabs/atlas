name: Trusted Self-Hosted CI

# Callable only after this file exists on main.
# Reusable workflow callers pin:
#   blitzcraftlabs/atlas/.github/workflows/trusted-self-hosted.yml@main
# Organization runner-group workflow allowlist (do not change):
#   blitzcraftlabs/atlas/.github/workflows/trusted-self-hosted.yml@refs/heads/main
# This is the only Atlas workflow that may target the Blitzcraft Trusted CI group.

permissions:
  contents: read
  pull-requests: write

on:
  workflow_call:
    inputs:
      suite:
        description:
          ci or ui-quality occupy Turing. bundle remains valid for compatibility but Atlas callers
          run Bundle Analysis on GitHub-hosted Ubuntu.
        type: string
        required: true
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  execute:
    name: ${{ inputs.suite }} (trusted runner)
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: ${{ vars.ATLAS_CI_RUNNER_GROUP || 'Blitzcraft Trusted CI' }}
      labels: ci
    timeout-minutes: 90
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      BUDGET_TOTAL_STATIC_JS_KB: 3000
      BUDGET_LARGEST_CHUNK_KB: 950
      MAX_BUNDLE_GROWTH_KB: 100
      MAX_BUNDLE_GROWTH_PERCENT: 15
    steps:
      - name: Validate suite input
        shell: bash
        run: |
          case "${{ inputs.suite }}" in
            ci|ui-quality|bundle)
              echo "Trusted self-hosted suite: ${{ inputs.suite }}"
              ;;
            *)
              echo "Unsupported trusted self-hosted suite: ${{ inputs.suite }}" >&2
              exit 1
              ;;
          esac

      - name: Repair default workspace permissions
        continue-on-error: true
        shell: bash
        run: |
          ws="${{ github.workspace }}"
          if [ -d "$ws" ]; then
            # Drop leftover nested-checkout dirs from the previous self-hosted layout.
            # Persistent /var/cache/ci stores are outside github.workspace and are not touched.
            find "$ws" -maxdepth 1 \( \
              -name 'ci-ws-*' -o -name 'ui-ws-*' -o -name 'bundle-ws-*' -o -name 'ci-link-*' \
            \) -exec rm -rf {} + 2>/dev/null || \
              sudo find "$ws" -maxdepth 1 \( \
                -name 'ci-ws-*' -o -name 'ui-ws-*' -o -name 'bundle-ws-*' -o -name 'ci-link-*' \
              \) -exec rm -rf {} + 2>/dev/null || true
            if find "$ws" -user root -print -quit 2>/dev/null | grep -q .; then
              echo "Repairing root-owned files in ${ws}"
              sudo chown -R "$(id -u):$(id -g)" "$ws" 2>/dev/null || \
                echo "Warning: could not repair ${ws}; actions/checkout will attempt a clean checkout."
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup CI Node (ci)
        if: inputs.suite == 'ci'
        uses: ./.github/actions/setup-ci-node

      - name: Setup CI Node (ui-quality)
        if: inputs.suite == 'ui-quality'
        uses: ./.github/actions/setup-ci-node

      - name: Setup CI Node (bundle)
        if: inputs.suite == 'bundle'
        uses: ./.github/actions/setup-ci-node

      - name: Run CI suite
        if: inputs.suite == 'ci'
        uses: ./.github/actions/run-ci-suite
        with:
          runner-profile: self-hosted

      - name: Run UI quality suite
        if: inputs.suite == 'ui-quality'
        uses: ./.github/actions/run-ui-quality-suite
        with:
          runner-profile: self-hosted

      - name: Run bundle analysis suite
        if: inputs.suite == 'bundle'
        uses: ./.github/actions/run-bundle-analysis-suite
        with:
          runner-profile: self-hosted

      - name: Cleanup job artifacts (ci)
        if: always() && inputs.suite == 'ci'
        uses: ./.github/actions/cleanup-self-hosted-job

      - name: Cleanup job artifacts (ui-quality)
        if: always() && inputs.suite == 'ui-quality'
        uses: ./.github/actions/cleanup-self-hosted-job

      - name: Cleanup job artifacts (bundle)
        if: always() && inputs.suite == 'bundle'
        uses: ./.github/actions/cleanup-self-hosted-job
